name: "Workflow 3"

on:
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Calculate 3+3 (deployment step)
        run: |
          echo "Calculating 3+3"
          result=$((3+3))
          echo "Result: $result"
          if [ "$result" -ne 6 ]; then
            echo "ERROR: expected 6 but got $result"
            exit 1
          fi

      - name: Report status
        run: |
          echo "Workflow 3 completed: 3+3 = $((3+3))"