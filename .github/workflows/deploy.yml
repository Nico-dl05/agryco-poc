name: "Workflow 3"

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start manual workflow
        run: |
          echo "Workflow 3 launched manually from GitHub Actions"

      - name: Calculate 3+3
        run: |
          echo "Calculating 3+3"
          result=$((3+3))
          echo "Result: $result"
          if [ "$result" -ne 6 ]; then
            echo "ERROR: expected 6 but got $result"
            exit 1
          fi

      - name: Report status
        run: |
          echo "Workflow 3 completed: 3+3 = $((3+3))"